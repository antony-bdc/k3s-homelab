---
# Default deny for the namespace ...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# ... and only Traefik (kube-system) may reach the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoami-from-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: whoami
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
