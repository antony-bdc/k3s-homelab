---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-like
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: { kind: HorizontalPodAutoscaler, name: whoami }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target: { kind: Deployment, name: whoami }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
  - target: { kind: Ingress, name: whoami }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: whoami.lab
configMapGenerator:
  - name: whoami-config
    behavior: merge
    literals:
      - WHOAMI_NAME=prod-like
