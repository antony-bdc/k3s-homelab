---
# Fast path: the same cluster shape in Docker (also used in CI).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: lab
servers: 1
agents: 2
image: rancher/k3s:v1.31.5-k3s1
ports:
  - port: 8080:80          # Traefik ingress -> http://whoami.localhost:8080
    nodeFilters: [loadbalancer]
options:
  k3d:
    wait: true
    timeout: 120s
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
